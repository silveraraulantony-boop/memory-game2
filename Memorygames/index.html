        const MemoryGame = () => {
          const [screen, setScreen] = useState('menu');
          const [gameMode, setGameMode] = useState(null);
          const [currentLevel, setCurrentLevel] = useState(1);
          const [cards, setCards] = useState([]);
          const [flippedCards, setFlippedCards] = useState([]);
          const [matchedPairs, setMatchedPairs] = useState([]);
          const [score, setScore] = useState(0);
          const [streak, setStreak] = useState(0);
          const [isChecking, setIsChecking] = useState(false);
          const [highScores, setHighScores] = useState({ 1: 0, 2: 0, 3: 0 });
          const [currentPlayer, setCurrentPlayer] = useState(1);
          const [player1Score, setPlayer1Score] = useState(0);
          const [player2Score, setPlayer2Score] = useState(0);
          const [player1Streak, setPlayer1Streak] = useState(0);
          const [player2Streak, setPlayer2Streak] = useState(0);

          useEffect(() => {
            const saved = localStorage.getItem('memoryGameScores');
            if (saved) {
              setHighScores(JSON.parse(saved));
            }
          }, []);

          const saveHighScore = (level, newScore) => {
            const updated = { ...highScores };
            if (newScore > updated[level]) {
              updated[level] = newScore;
              setHighScores(updated);
              localStorage.setItem('memoryGameScores', JSON.stringify(updated));
            }
          };

          const isLevelUnlocked = (level) => {
            if (level === 1) return true;
            return highScores[level - 1] >= LEVEL_DATA[level].requiredScore;
          };

          const shuffleCards = (levelCards) => {
            return [...levelCards].sort(() => Math.random() - 0.5);
          };

          const startLevel = (level, mode) => {
            if (!isLevelUnlocked(level)) return;
            
            const levelCards = LEVEL_DATA[level].cards;
            setCards(shuffleCards(levelCards));
            setCurrentLevel(level);
            setGameMode(mode);
            setFlippedCards([]);
            setMatchedPairs([]);
            setScore(0);
            setStreak(0);
            setCurrentPlayer(1);
            setPlayer1Score(0);
            setPlayer2Score(0);
            setPlayer1Streak(0);
            setPlayer2Streak(0);
            setScreen('game');
          };

          const handleCardClick = (cardId) => {
            if (isChecking || flippedCards.length >= 2 || flippedCards.includes(cardId) || matchedPairs.includes(cardId)) {
              return;
            }

            const newFlipped = [...flippedCards, cardId];
            setFlippedCards(newFlipped);

            if (newFlipped.length === 2) {
              setIsChecking(true);
              const card1 = cards.find(c => c.id === newFlipped[0]);
              const card2 = cards.find(c => c.id === newFlipped[1]);

              setTimeout(() => {
                if (card1.pair === card2.pair) {
                  setMatchedPairs([...matchedPairs, newFlipped[0], newFlipped[1]]);
                  
                  if (gameMode === 'single') {
                    setScore(score + 10);
                    setStreak(streak + 1);
                  } else {
                    if (currentPlayer === 1) {
                      setPlayer1Score(player1Score + 10);
                      setPlayer1Streak(player1Streak + 1);
                    } else {
                      setPlayer2Score(player2Score + 10);
                      setPlayer2Streak(player2Streak + 1);
                    }
                  }
                  
                  setFlippedCards([]);
                  setIsChecking(false);

                  if (matchedPairs.length + 2 === cards.length) {
                    setTimeout(() => {
                      if (gameMode === 'single') {
                        saveHighScore(currentLevel, score + 10);
                      }
                      
                      if (currentLevel < 3) {
                        setScreen('levelComplete');
                      } else {
                        setScreen('gameComplete');
                      }
                    }, 500);
                  }
                } else {
                  if (gameMode === 'single') {
                    setStreak(0);
                  } else {
                    if (currentPlayer === 1) {
                      setPlayer1Streak(0);
                      setCurrentPlayer(2);
                    } else {
                      setPlayer2Streak(0);
                      setCurrentPlayer(1);
                    }
                  }
                  setFlippedCards([]);
                  setIsChecking(false);
                }
              }, 1000);
            }
          };

          const isCardFlipped = (cardId) => {
            return flippedCards.includes(cardId) || matchedPairs.includes(cardId);
          };

          if (screen === 'menu') {
            return (
              <div className="min-h-screen bg-gradient-to-br from-purple-500 via-pink-500 to-orange-400 flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-m d w-full">
                  <div className="text-center mb-8">
                    <Sparkles className="w-16 h-16 mx-auto text-yellow-500 mb-4" />
                    <h1 className="text-4xl font-bold text-gray-800 mb-2">Memory Game</h1>
                    <p className="text-gray-600">Aprende inglés jugando</p>
                  </div>

                  <div className="space-y-4">
                    {[1, 2, 3].map((level) => {
                      const unlocked = isLevelUnlocked(level);
                      const levelData = LEVEL_DATA[level];
                      
                      return (
                        <div key={level} className="relative">
                          <div className={`${!unlocked ? 'opacity-50' : ''}`}>
                            <div className="bg-gradient-to-r from-indigo-500 to-purple-600 text-white p-4 rounded-xl mb-2">
                              <div className="flex items-center justify-between mb-2">
                                <span className="font-bold text-lg">Level {level}</span>
                                {unlocked ? (
                                  <Star className="w-5 h-5 text-yellow-300" />
                                ) : (
                                  <Lock className="w-5 h-5" />
                                )}
                              </div>
                              <p className="text-sm opacity-90">{levelData.name}</p>
                              {level > 1 && (
                                <p className="text-xs mt-1 opacity-75">
                                  Requiere {levelData.requiredScore} puntos en Nivel {level - 1}
                                </p>
                              )}
                              {unlocked && highScores[level] > 0 && (
                                <p className="text-xs mt-1 bg-white/20 rounded px-2 py-1 inline-block">
                                  Best: {highScores[level]} pts
                                </p>
                              )}
                            </div>
                            
                            {unlocked && (
                              <div className="flex gap-2">
                                <button
                                  onClick={() => startLevel(level, 'single')}
                                  className="flex-1 bg-blue-500 text-white py-3 rounded-lg font-semibold hover:bg-blue-600 transition-all transform hover:scale-105"
                                >
                                  Solo
                                </button>
                                <button
                                  onClick={() => startLevel(level, 'multi')}
                                  className="flex-1 bg-green-500 text-white py-3 rounded-lg font-semibold hover:bg-green-600 transition-all transform hover:scale-105 flex items-center justify-center"
                                >
                                  <Users className="w-4 h-4 mr-2" />
                                  2 Players
                                </button>
                              </div>
                            )}
                          </div>
                          
                          {!unlocked && (
                            <div className="absolute inset-0 flex items-center justify-center">
                              <Lock className="w-12 h-12 text-gray-400" />
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            );

          if (screen === 'levelComplete') {
            const finalScore = gameMode === 'single' ? score : Math.max(player1Score, player2Score);
            const winner = gameMode === 'multi' 
              ? (player1Score > player2Score ? 'Player 1' : player2Score > player1Score ? 'Player 2' : 'Empate')

            return (
              <div className="min-h-screen bg-gradient-to-br from-green-400 to-blue-500 flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full text-center">
                  <Trophy className="w-24 h-24 mx-auto text-yellow-500 mb-4" />
                  <h2 className="text-4xl font-bold text-gray-800 mb-4">Level Complete!</h2>
                  
                  {gameMode === 'single' ? (
                    <>
                      <p className="text-2xl text-gray-700 mb-2">Score: {score}</p>
                      <p className="text-xl text-gray-600 mb-6">Best Streak: {streak}</p>
                    </>
                  ) : (
                    <>
                      <p className="text-2xl font-bold text-purple-600 mb-4">{winner} Wins!</p>
                      <div className="flex justify-around mb-6">
                        <div>
                          <p className="text-lg font-bold text-blue-600">Player 1</p>
                          <p className="text-xl">{player1Score} pts</p>
                        </div>
                        <div>
                          <p className="text-lg font-bold text-green-600">Player 2</p>
                          <p className="text-xl">{player2Score} pts</p>
                        </div>
                      </div>
                    </>
                  )}

                  <div className="space-y-4">
                    {isLevelUnlocked(currentLevel + 1) && currentLevel < 3 && (
                      <button
                        onClick={() => startLevel(currentLevel + 1, gameMode)}
                        className="w-full bg-gradient-to-r from-green-500 to-green-600 text-white py-4 rounded-xl font-semibold text-lg hover:from-green-600 hover:to-green-700 transition-all transform hover:scale-105 shadow-lg"
                      >
                        Next Level
                      </button>
                    )}

                    <button
                      onClick={() => startLevel(currentLevel, gameMode)}
                      className="w-full bg-blue-500 text-white py-4 rounded-xl font-semibold text-lg hover:bg-blue-600 transition-all"
                    >
                      Play Again
                    </button>

                    <button
                      onClick={() => setScreen('menu')}
                      className="w-full bg-gray-200 text-gray-800 py-4 rounded-xl font-semibold text-lg hover:bg-gray-300 transition-all"
                    >
                      Main Menu
                    </button>
                  </div>
                </div>
              </div>
            );
          }

          if (screen === 'gameComplete') {
            const finalScore = gameMode === 'single' ? score : Math.max(player1Score, player2Score);
            const winner = gameMode === 'multi' 
              ? (player1Score > player2Score ? 'Player 1' : player2Score > player1Score ? 'Player 2' : 'Empate')
              : null;

            return (
              <div className="min-h-screen bg-gradient-to-br from-yellow-400 via-orange-500 to-pink-500 flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full text-center">
                  <Trophy className="w-32 h-32 mx-auto text-yellow-500 mb-4 animate-bounce" />
                  <h2 className="text-5xl font-bold text-gray-800 mb-4">Congratulations!</h2>
                  <p className="text-xl text-gray-700 mb-4">You completed all levels!</p>
                  
                  {gameMode === 'single' ? (
                    <>
                      <p className="text-2xl text-gray-700 mb-2">Final Score: {score}</p>
                      <p className="text-xl text-gray-600 mb-6">Best Streak: {streak}</p>
                    </>
                  ) : (
                    <>
                      <p className="text-2xl font-bold text-purple-600 mb-4">{winner} Wins!</p>
                      <div className="flex justify-around mb-6">
                        <div>
                          <p className="text-lg font-bold text-blue-600">Player 1</p>
                          <p className="text-xl">{player1Score} pts</p>
                        </div>
                        <div>
                          <p className="text-lg font-bold text-green-600">Player 2</p>
                          <p className="text-xl">{player2Score} pts</p>
                        </div>
                      </div>
                    </>
                  )}

                  <button
                    onClick={() => setScreen('menu')}
                    className="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white py-4 rounded-xl font-semibold text-lg hover:from-purple-600 hover:to-pink-600 transition-all transform hover:scale-105 shadow-lg"
                  >
                    Play Again
                  </button>
                </div>
              </div>
            );
          }

          return (
            <div className="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 p-4">
              <div className="max-w-6xl mx-auto">
                <div className="bg-white rounded-2xl shadow-lg p-4 mb-4">
                  <div className="flex items-center justify-between">
                    <button
                      onClick={() => setScreen('menu')}
                      className="flex items-center text-gray-700 hover:text-gray-900 font-semibold"
                    >
                      <ArrowLeft className="w-5 h-5 mr-2" />
                      Menu
                    </button>

                    {gameMode === 'single' ? (
                      <div className="flex items-center space-x-6">
                        <div className="flex items-center">
                          <Flame className={`w-6 h-6 mr-2 ${streak > 0 ? 'text-orange-500' : 'text-gray-400'}`} />
                          <span className="font-bold text-lg">{streak}</span>
                        </div>

                        <div className="flex items-center">
                          <Star className="w-6 h-6 mr-2 text-yellow-500" />
                          <span className="font-bold text-lg">{score}</span>
                        </div>
                      </div>
                    ) : (
                      <div className="flex items-center space-x-4">
                        <div className={`flex items-center px-3 py-2 rounded-lg ${currentPlayer === 1 ? 'bg-blue-100 border-2 border-blue-500' : 'bg-gray-100'}`}>
                          <div className="text-center">
                            <p className="text-xs font-semibold text-blue-600">Player 1</p>
                            <div className="flex items-center space-x-2">
                              <Flame className={`w-4 h-4 ${player1Streak > 0 ? 'text-orange-500' : 'text-gray-400'}`} />
                              <span className="text-sm font-bold">{player1Streak}</span>
                              <Star className="w-4 h-4 text-yellow-500" />
                              <span className="text-sm font-bold">{player1Score}</span>
                            </div>
                          </div>
                        </div>

                        <div className={`flex items-center px-3 py-2 rounded-lg ${currentPlayer === 2 ? 'bg-green-100 border-2 border-green-500' : 'bg-gray-100'}`}>
                          <div className="text-center">
                            <p className="text-xs font-semibold text-green-600">Player 2</p>
                            <div className="flex items-center space-x-2">
                              <Flame className={`w-4 h-4 ${player2Streak > 0 ? 'text-orange-500' : 'text-gray-400'}`} />
                              <span className="text-sm font-bold">{player2Streak}</span>
                              <Star className="w-4 h-4 text-yellow-500" />
                              <span className="text-sm font-bold">{player2Score}</span>
                            </div>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                </div>

                <div className="text-center mb-6">
                  <h2 className="text-3xl font-bold text-white drop-shadow-lg">
                    Level {currentLevel}: {LEVEL_DATA[currentLevel].name}
                  </h2>
                  {gameMode === 'multi' && (
                    <p className="text-xl font-semibold text-white mt-2 drop-shadow">
                      Turn: <span className={currentPlayer === 1 ? 'text-blue-200' : 'text-green-200'}>
                        Player {currentPlayer}
                      </span>
                    </p>
                  )}
                </div>

                <div className="grid grid-cols-6 gap-2 sm:gap-3">
                  {cards.map((card) => (
                    <div
                      key={card.id}
                      onClick={() => handleCardClick(card.id)}
                      className={`aspect-square cursor-pointer transition-all duration-300 transform hover:scale-105 ${
                        isChecking && flippedCards.includes(card.id) ? '' : 'hover:shadow-xl'
                      }`}
                      style={{ perspective: '1000px' }}
                    >
                      <div
                        className={`relative w-full h-full transition-transform duration-500 ${
                          isCardFlipped(card.id) ? 'rotate-y-180' : ''
                        }`}
                        style={{ transformStyle: 'preserve-3d' }}
                      >
                        <div
                          className="absolute w-full h-full bg-gradient-to-br from-blue-400 to-purple-500 rounded-lg shadow-lg flex items-center justify-center"
                          style={{ backfaceVisibility: 'hidden' }}
                        >
                          <Sparkles className="w-8 h-8 text-white" />
                        </div>

                        <div
                          className="absolute w-full h-full bg-white rounded-lg shadow-lg flex flex-col items-center justify-center p-2 rotate-y-180"
                          style={{ backfaceVisibility: 'hidden', transform: 'rotateY(180deg)' }}
                        >
                          {currentLevel < 3 ? (
                            <>
                              <div className="text-4xl mb-1">{card.image}</div>
                              <div className="text-center">
                                <p className="font-bold text-xs sm:text-sm text-gray-800">{card.word}</p>
                                <p className="text-xs text-gray-600">{card.pronunciation}</p>
                              </div>
                            </>
                          ) : (
                            <div className="text-center px-1">
                              <p className={`font-semibold text-xs sm:text-sm ${card.lang === 'en' ? 'text-blue-700' : 'text-gray-800'}`}>
                                {card.text}
                              </p>
                              {card.pronunciation && (
                                <p className="text-xs text-gray-600 mt-1">{card.pronunciation}</p>
                              )}
                            </div>
                          )}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="mt-6 bg-white rounded-2xl shadow-lg p-4">
                  <div className="flex justify-between items-center mb-2">
                    <span className="font-semibold text-gray-700">Progress</span>
                    <span className="font-bold text-gray-800">{matchedPairs.length / 2} / 18</span>
                  </div>
                  <div className="w-full bg-gray-200 rounded-full h-3">
                    <div
                      className="bg-gradient-to-r from-green-400 to-blue-500 h-3 rounded-full transition-all duration-500"
                      style={{ width: `${(matchedPairs.length / cards.length) * 100}%` }}
                    ></div>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        ReactDOM.render(<MemoryGame />, document.getElementById('root'));
    </script>

    </script>
</body>
